name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  # Credenciais descartáveis de teste, não são segredo. O prisma.config.ts lê DATABASE_URL do
  # ambiente (o dotenv não sobrescreve variável já definida). Só o job "Integration (Postgres)"
  # abre conexão, contra o service container abaixo; os demais só rodam o prisma generate.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/studyforge_ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    # Não obrigatório no ruleset proteger-main.
    name: Integration (Postgres)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: studyforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d studyforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar migrations
        run: npx prisma migrate deploy
      - name: Testes de integração
        run: npx nx run-many -t test-integration --output-style=static

  audit:
    name: "Dependency check: vulnerabilidade conhecida (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit de produção (bloqueia)
        run: npm run audit
      - name: Audit completo, inclui dev (informativo)
        run: npm run audit:full
        continue-on-error: true

  dependency-review:
    name: "Dependency check: revisão do PR (dependency-review-action)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
